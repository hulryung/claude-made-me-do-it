<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Made Me Do It</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    /* ---- Theme variables ---- */
    :root {
      --bg: #f7f7f8;
      --surface: #ffffff;
      --surface-2: #fafafa;
      --fg: #1a1a1a;
      --fg-2: #3a3a3a;
      --muted: #666;
      --muted-2: #888;
      --border: #e3e3e6;
      --border-strong: #cfcfd3;
      --accent: #6d4cff;
      --accent-soft: #ece7ff;
      --accent-fg: #ffffff;
      --success: #16a34a;
      --failure: #c0392b;
      --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.04);
      --radius: 12px;
      --radius-sm: 8px;
      --gutter: 1.25rem;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0e1014;
        --surface: #15181d;
        --surface-2: #1b1f26;
        --fg: #e6e6e6;
        --fg-2: #c9c9cc;
        --muted: #8a8d93;
        --muted-2: #6f7178;
        --border: #2a2d33;
        --border-strong: #3a3d44;
        --accent: #8a6bff;
        --accent-soft: #2a2244;
        --accent-fg: #ffffff;
        --success: #22c55e;
        --failure: #ef4444;
        --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 12px rgba(0,0,0,0.25);
      }
    }
    :root[data-theme="dark"] {
      --bg: #0e1014;
      --surface: #15181d;
      --surface-2: #1b1f26;
      --fg: #e6e6e6;
      --fg-2: #c9c9cc;
      --muted: #8a8d93;
      --muted-2: #6f7178;
      --border: #2a2d33;
      --border-strong: #3a3d44;
      --accent: #8a6bff;
      --accent-soft: #2a2244;
      --accent-fg: #ffffff;
      --success: #22c55e;
      --failure: #ef4444;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 12px rgba(0,0,0,0.25);
    }

    /* ---- Reset ---- */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ---- Page grid ---- */
    body {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto auto 1fr auto auto auto;
      gap: var(--gutter);
      padding: var(--gutter) calc(var(--gutter) * 2);
    }
    @media (max-width: 768px) {
      body { padding: var(--gutter); }
    }

    /* ---- Reusable utilities ---- */
    .muted { color: var(--muted); }
    .small { font-size: 12px; }

    /* ---- Code monospace stack used by panels and stats ---- */
    .mono {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
  </style>
</head>
<body>
  <header class="page-header">
    <!-- speech bubble + title + theme toggle (Task 3) -->
  </header>

  <section class="feature-badges">
    <!-- 3 feature badges (Task 4) -->
  </section>

  <main class="panels">
    <!-- input + output code panels (Tasks 5-7) -->
    <section class="code-pane code-pane--input">
      <header class="code-pane-header">
        <span class="step-badge">1</span>
        <span class="code-pane-title" id="input-title">Paste AI-copied text here</span>
        <span class="code-pane-hint">Ctrl / ⌘ + V</span>
      </header>
      <div class="code-area">
        <div class="line-numbers" id="input-gutter" aria-hidden="true">1</div>
        <pre class="ws-overlay" id="input-overlay" aria-hidden="true"></pre>
        <textarea
          id="input"
          class="code-input"
          spellcheck="false"
          autocomplete="off"
          autocapitalize="off"
          aria-labelledby="input-title"
          placeholder="Paste here…"></textarea>
      </div>
    </section>

    <div class="panels-arrow" aria-hidden="true">→</div>

    <section class="code-pane code-pane--output">
      <header class="code-pane-header">
        <span class="step-badge">2</span>
        <span class="code-pane-title" id="output-title">Cleaned output</span>
        <button id="copy" class="copy-btn" type="button">Copy</button>
      </header>
      <div class="code-area">
        <div class="line-numbers" id="output-gutter" aria-hidden="true">1</div>
        <pre class="ws-overlay" id="output-overlay" aria-hidden="true"></pre>
        <textarea
          id="output"
          class="code-input"
          spellcheck="false"
          autocomplete="off"
          readonly
          aria-labelledby="output-title"
          placeholder="Cleaned result will appear here."></textarea>
      </div>
    </section>
  </main>

  <section class="supporting-cards">
    <!-- "What this does" + smart-exception note (Task 8) -->
  </section>

  <section class="stats-bar" id="stats-bar">
    <!-- 3 metric tiles + info box (Task 9) -->
    <span id="stats"></span>
  </section>

  <footer class="page-footer">
    <!-- attribution (Task 10) -->
  </footer>

  <script src="clean.js"></script>
  <script>
    /* JS will be added in Task 11 */
  </script>
</body>
</html>
