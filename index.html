<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>claude-made-me-do-it</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1a1a1a;
      --muted: #666;
      --border: #d0d0d0;
      --pane-bg: #fafafa;
      --accent: #2563eb;
      --accent-fg: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --fg: #e6e6e6;
        --muted: #888;
        --border: #2a2d33;
        --pane-bg: #15181d;
        --accent: #3b82f6;
        --accent-fg: #ffffff;
      }
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1rem 1.25rem 0.5rem;
    }
    h1 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    .tagline {
      margin: 0.25rem 0 0;
      color: var(--muted);
      font-size: 0.85rem;
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      padding: 0.75rem 1.25rem 0.5rem;
      min-height: 0;
    }
    @media (max-width: 768px) {
      main { grid-template-columns: 1fr; }
    }

    .pane {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--pane-bg);
      min-height: 0;
    }
    .pane label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      padding: 0.5rem 0.75rem;
    }
    .pane-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-right: 0.5rem;
    }
    .pane textarea {
      flex: 1;
      width: 100%;
      border: 0;
      outline: 0;
      resize: none;
      background: transparent;
      color: var(--fg);
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 13px;
      line-height: 1.5;
      padding: 0 0.75rem 0.75rem;
      tab-size: 4;
    }
    .pane textarea::placeholder {
      color: var(--muted);
    }

    button#copy {
      background: var(--accent);
      color: var(--accent-fg);
      border: 0;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      margin: 0.25rem 0;
    }
    button#copy:active { transform: translateY(1px); }
    button#copy.copied { background: #16a34a; }

    footer {
      padding: 0.5rem 1.25rem 0.75rem;
      color: var(--muted);
      font-size: 0.75rem;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
  </style>
</head>
<body>
  <header>
    <h1>claude-made-me-do-it</h1>
    <p class="tagline">Paste from Claude Code or any AI tool. Get clean, copy-ready text.</p>
  </header>

  <main>
    <section class="pane pane-input">
      <label for="input">Input</label>
      <textarea
        id="input"
        spellcheck="false"
        autocomplete="off"
        placeholder="Paste here…"></textarea>
    </section>

    <section class="pane pane-output">
      <div class="pane-header">
        <label for="output">Output</label>
        <button id="copy" type="button">Copy</button>
      </div>
      <textarea
        id="output"
        spellcheck="false"
        autocomplete="off"
        readonly
        placeholder="Cleaned result will appear here."></textarea>
    </section>
  </main>

  <footer>
    <span id="stats"></span>
  </footer>

  <script src="clean.js"></script>
  <script>
    // wiring goes here in Task 9
  </script>
</body>
</html>
